name: Test, Build and Release

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Restore
        run: dotnet restore Nornia.sln

      - name: Test
        run: dotnet test Nornia.sln --configuration Release --no-restore

  build:
    name: Build installer (${{ matrix.rid }})
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Determine version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME.StartsWith('v')) {
            $version = $env:GITHUB_REF_NAME.Substring(1)
          } else {
            $version = (Get-Date -Format 'yyyy.MM.dd')
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Restore
        run: dotnet restore Nornia.sln -r ${{ matrix.rid }}

      - name: Publish self-contained package
        run: >
          dotnet publish src/Nornia.Desktop/Nornia.Desktop.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          --no-restore
          -p:Version=${{ env.VERSION }}
          -o publish/${{ matrix.rid }}

      - name: Build installer
        shell: pwsh
        run: |
          $rid = '${{ matrix.rid }}'
          $architecture = if ($rid -eq 'win-arm64') { 'arm64' } else { 'x64compatible' }
          $sourceDir = (Resolve-Path "publish/$rid").Path
          $outputDir = Join-Path $PWD 'installer-output'
          $iconPath = (Resolve-Path 'src/Nornia.Desktop/Assets/app.ico').Path
          New-Item -ItemType Directory -Path $outputDir -Force | Out-Null

          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          }
          if (-not (Test-Path -LiteralPath $iscc)) {
            throw "Inno Setup compiler not found: $iscc"
          }

          & $iscc installer/Nornia.iss `
            "/DAppVersion=$env:VERSION" `
            "/DAppRid=$rid" `
            "/DAppArchitecture=$architecture" `
            "/DSourceDir=$sourceDir" `
            "/DOutputDir=$outputDir" `
            "/DIconPath=$iconPath"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE"
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v6
        with:
          name: Nornia-Installer-${{ matrix.rid }}
          path: installer-output/*.exe
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download release packages
        uses: actions/download-artifact@v6
        with:
          pattern: Nornia-Installer-*
          path: release-assets
          merge-multiple: true

      - name: Create release and upload packages
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: gh release create "$TAG_NAME" release-assets/*.exe --title "Nornia $TAG_NAME" --generate-notes --draft
